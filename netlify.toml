# Netlify build config for the PM Analyst Agent dashboard (Vite + React).
# The app lives in frontend/web; publish path is relative to `base`.
[build]
  base = "frontend/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: the app routes via in-app tab state, so any deep link resolves
# to index.html rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
